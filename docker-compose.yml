services:
  api:
    build: .
    image: credit-scoring-api:latest
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
    volumes:
      - ./models:/app/models:ro   # produced by `make train`
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

volumes:
  mlflow-data:
