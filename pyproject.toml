[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "1.0.0"
description = "Probability-of-default model for retail lending: LightGBM/CatBoost, MLflow, FastAPI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alisher Izmukhan" }]
license = { text = "MIT" }
# Serving dependencies. Core ML libraries are pinned to a minor version because the
# model is persisted with joblib (pickle): the API must load it with the same versions.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn~=1.9.1",
    "lightgbm~=4.7.0",
    "catboost~=1.2.10",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
train = [
    "optuna>=4.0",
    "mlflow>=3.0",
    "shap>=0.46",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "kaggle>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src/credit_scoring", "api"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI dependency defaults

[tool.ruff.lint.isort]
known-first-party = ["credit_scoring", "api"]
